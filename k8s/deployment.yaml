apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapplication
  labels:
    app: myapplication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapplication
  template:
    metadata:
      labels:
        app: myapplication
    spec:
      # OCIR repositories are private by default — the cluster's own nodes
      # need real, authenticated pull access, the same secret name/shape
      # the Infrastructure Provisioning Portal already creates in this
      # app's namespace before every build (kubernetes_client.
      # ensure_pull_secret, "ocir-pull-secret"). Without this, the image
      # builds and pushes successfully but the pod can never actually pull
      # it back out ("Anonymous users are only allowed read access on
      # public repos" — the real failure this fixes).
      imagePullSecrets:
        - name: ocir-pull-secret
      containers:
        - name: myapplication
          # Replaced with the real OCIR image the Build and Deploy pipeline
          # pushes (see the portal's own image-mirroring discipline) — this
          # placeholder is what the repo ships with before that pipeline
          # exists.
          image: me-dubai-1.ocir.io/axuri6bvn1y8/infra-portal/myapplication:req-2026-0104
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
